name: CI - Feature Validation

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

jobs:
  quality-check:
    name: 🔍 Validate Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: 🔍 Check lockfile presence
        run: |
          if [ ! -f "pnpm-lock.yaml" ]; then
            echo "❌ pnpm-lock.yaml not found!"
            exit 1
          fi
          echo "✅ pnpm-lock.yaml found."


      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧹 Run ESLint
        run: pnpm lint

      - name: 🧪 Run Jest Tests with Coverage
        run: pnpm test:cov

      - name: 📊 Enforce Minimum Coverage
        run: |
          THRESHOLD=80
          COVERAGE=$(npx jest --coverage --coverageReporters=text-summary | grep 'All files' | awk '{print $4}' | tr -d '%')
          echo "Coverage: $COVERAGE%"
          if [ "$COVERAGE" -lt "$THRESHOLD" ]; then
            echo "❌ Coverage below $THRESHOLD%. Merge blocked."
            exit 1
          fi
          echo "✅ Coverage meets threshold."
